<section class="hero">
  <div id="carouselExampleSlidesOnly" class="carousel slide carousel-fade" data-bs-ride="carousel">
    <div class="carousel-inner">
      <!-- Glass lifts: the cabins are separate layers that ride up and down -->
      <div class="carousel-item active item2" data-bs-interval="10000">
        <div class="cabin cabin-left"></div>
        <div class="cabin cabin-right"></div>
      </div>
      <div class="carousel-item item1"></div>
      <div class="carousel-item item3"></div>
    </div>
  </div>

  <div class="hero-overlay">
    <div class="hero-content">
      <h1>{{ "home.heroTitle" | translate }}</h1>
      <p>{{ "home.heroText" | translate }}</p>
      <div class="hero-actions">
        <a class="btn-brand" routerLink="/parts">{{ "home.orderParts" | translate }}</a>
        <a class="btn-ghost" [routerLink]="[]" fragment="contactusid">{{ "home.contactUs" | translate }}</a>
      </div>
    </div>
  </div>
</section>
