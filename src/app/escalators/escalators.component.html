<section class="page-intro">
  <h1>{{ "intro.escalatorsTitle" | translate }}</h1>
  <p>{{ "intro.escalatorsText" | translate }}</p>
  <div class="page-intro-actions">
    <a class="btn-brand" routerLink="/quote">{{ "intro.quote" | translate }}</a>
    <a class="btn btn-outline-success" routerLink="/service">{{ "intro.service" | translate }}</a>
  </div>
</section>
<div class="gallery-lightbox-container">
    <div class="gallery">
      <div *ngFor="let a of data; let i = index" class="gallery-img">
        <img (click)="onPrewieimg(i)" [src]="a.imageSrc" [alt]="a.imageAlt">
        <button (click)="downloadImage(a.downloadUrl)">Download pdf</button>
      </div>
    </div>
    <div *ngIf="showmask" class="lightbox" @animation2>
      <span *ngIf="showcount" class="count">{{ currentIndex + 1 }}/{{ totalimagecount }}</span>
      <button *ngIf="previewimage" class="close-btn" (click)="onclosepreview()">
        <i class="far fa-times"></i>
      </button>
      <button *ngIf="controls" class="btn-lightbox-carousel btn-prev" (click)="prev()">
        <i class="fas fa-arrow-circle-left icon-lightbox-carousel icon-prev"></i>
      </button>
      <button *ngIf="controls" class="btn-lightbox-carousel btn-next" (click)="next()">
        <i class="fas fa-arrow-circle-right icon-lightbox-carousel icon-next"></i>
      </button>
      <div *ngIf="previewimage" [@animation]="'visible'" (@animation.done)="onanimationend($event)" class="lightbox-image">
        <img [src]="currentLightboxImage.imageSrc" [alt]="currentLightboxImage.imageAlt">
      </div>
    </div>
  </div>
  
<section class="articles-banner">
  <p>{{ "articles.escalatorBanner" | translate }}</p>
  <a class="btn-brand" routerLink="/articles">{{ "articles.title" | translate }} →</a>
</section>
