<div class="login-box">
  <h1>Admin</h1>
  <form (ngSubmit)="submit()" #f="ngForm">
    <input class="form-control" type="email" name="email" [(ngModel)]="email" required placeholder="Email" autocomplete="username" />
    <input class="form-control" type="password" name="password" [(ngModel)]="password" required placeholder="Password" autocomplete="current-password" />
    <p *ngIf="error" class="text-danger">არასწორი ელ-ფოსტა ან პაროლი</p>
    <button class="btn btn-success w-100" [disabled]="f.invalid || loading">შესვლა</button>
  </form>
</div>
