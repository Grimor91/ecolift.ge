<div class="admin-panel">
    <h1>Add New Product</h1>
  
    <form (ngSubmit)="onSubmit()" #productForm="ngForm">
      <!-- Product Name -->
      <div class="form-group">
        <label for="productName">Product Name</label>
        <input
          type="text"
          id="productName"
          name="name"
          class="form-control"
          [(ngModel)]="product.name"
          required
        />
      </div>
  
      <!-- Product Code -->
      <div class="form-group">
        <label for="productCode">Product Code</label>
        <input
          type="text"
          id="productCode"
          name="code"
          class="form-control"
          [(ngModel)]="product.code"
          required
        />
      </div>
  
      <!-- Product Description -->
      <div class="form-group">
        <label for="productDescription">Product Description</label>
        <textarea
          id="productDescription"
          name="description"
          class="form-control"
          [(ngModel)]="product.description"
          rows="4"
          required
        ></textarea>
      </div>
  
      <!-- Image Upload -->
      <div class="form-group">
        <label for="productImages">Upload Product Images</label>
        <input
          type="file"
          id="productImages"
          name="images"
          class="form-control"
          (change)="onImageUpload($event)"
          multiple
          accept="image/*"
        />
        <div class="image-preview" *ngIf="images.length">
          <h3>Preview:</h3>
          <div class="image-list">
            <div *ngFor="let image of images; let i = index" class="image-item">
              <img [src]="image" alt="Product Image {{ i + 1 }}" />
              <button type="button" (click)="removeImage(i)">Remove</button>
            </div>
          </div>
        </div>
      </div>
  
      <button type="submit" class="btn btn-primary">Save Product</button>
    </form>
  </div>
